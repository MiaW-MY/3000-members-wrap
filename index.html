  <div id="deck" class="deck" aria-label="BA Career Meetup celebration slides">
    <p style="padding:24px;text-align:center;color:#6B4E9B">Loading…</p>
  </div>

  <div class="progress" id="progress" aria-hidden="true"></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VT3J1LFYX7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    const isDebug = new URLSearchParams(location.search).has('debug');
    const wrapHostname = location.hostname;
    const wrapEntry = wrapHostname === 'bacareer-3000-wrapup.easygoat.co.nz'
      ? 'custom_domain'
      : wrapHostname === '3000-members-wrap-site.pages.dev'
        ? 'pages_dev'
        : wrapHostname;

    window.WRAP_ANALYTICS = { hostname: wrapHostname, entry: wrapEntry };

    const wrapParams = (extra) => Object.assign({ wrap_hostname: wrapHostname, wrap_entry: wrapEntry }, extra);

    gtag('config', 'G-VT3J1LFYX7', wrapParams(isDebug ? { debug_mode: true } : {}));
    gtag('event', 'wrap_session_start', wrapParams());

    const viewedScreens = new Set();
    window.trackScreen = (screenId, screenIndex, screenName) => {
      if (!screenId || viewedScreens.has(screenId)) return;
      viewedScreens.add(screenId);
      const label = screenName || screenId;
      const wrapEvent = 'wrap_' + screenId.replace(/-/g, '_');

      // screen_view — aggregate; screen_name is a parameter (not shown in Firebase event list)
      gtag('event', 'screen_view', wrapParams({
        screen_name: label,
        screen_class: screenId,
        screen_index: screenIndex,
      }));
      // wrap_* — one event per screen, visible directly in Events report
      gtag('event', wrapEvent, wrapParams({
        screen_label: label,
        screen_index: screenIndex,
      }));

      if (isDebug) console.log('[analytics]', wrapEvent, label, screenIndex, wrapEntry);
    };

    window.dispatchEvent(new Event('firebase-ready'));
  </script>
  <script defer src="js/content.js?v=126"></script>
  <script defer src="js/app.js?v=126"></script>
